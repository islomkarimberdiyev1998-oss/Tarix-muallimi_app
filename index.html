<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tarix Muallim</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { box-sizing: border-box; }
body {
    font-family: sans-serif;
    background: #0f172a;
    color: #ffffff;
    margin: 0;
    padding: 15px;
    display: flex;
    justify-content: center;
}
.card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 16px;
    padding: 18px;
    width: 100%;
    max-width: 420px;
}
h2 { color: #fbbf24; text-align: center; margin: 0 0 8px 0; }
.sub { text-align: center; color: #94a3b8; font-size: 14px; margin-bottom: 16px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.g-btn {
    background: #334155;
    border: 1px solid #fbbf24;
    color: #fff;
    padding: 15px 8px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}
.t-btn {
    width: 100%;
    background: #2563eb;
    color: #fff;
    border: none;
    padding: 15px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: bold;
    text-align: left;
    cursor: pointer;
    margin-bottom: 10px;
    line-height: 1.4;
}
.back {
    width: 100%;
    background: #475569;
    color: #fff;
    border: none;
    padding: 12px;
    border-radius: 10px;
    font-size: 14px;
    margin-top: 10px;
    cursor: pointer;
}
.bar { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; }
.t-bg { width: 100%; height: 8px; background: #334155; border-radius: 5px; margin-bottom: 14px; overflow: hidden; }
.t-fill { height: 100%; width: 100%; background: #22c55e; }
.q-text { font-size: 17px; font-weight: bold; margin-bottom: 15px; line-height: 1.4; }
.opt {
    display: block;
    width: 100%;
    padding: 13px;
    margin-bottom: 9px;
    background: #334155;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    text-align: left;
    cursor: pointer;
}
.hide { opacity: 0.2; pointer-events: none; }
.ok { background: #16a34a !important; }
.no { background: #dc2626 !important; }
.help {
    background: #f59e0b;
    color: #000;
    border: none;
    padding: 6px 12px;
    border-radius: 8px;
    font-weight: bold;
    margin-bottom: 12px;
    cursor: pointer;
}
.help:disabled { opacity: 0.3; }
</style>
</head>
<body>

<div class="card" id="screen-home">
    <h2>⚔️ Tarix Muallim</h2>
    <div class="sub">Sinfni tanlang:</div>
    <div class="grid">
        <button class="g-btn" onclick="openGrade(5)">📚 5-sinf</button>
        <button class="g-btn" onclick="openGrade(6)">📚 6-sinf</button>
        <button class="g-btn" onclick="openGrade(7)">📚 7-sinf</button>
        <button class="g-btn" onclick="openGrade(8)">📚 8-sinf</button>
        <button class="g-btn" onclick="openGrade(9)">📚 9-sinf</button>
        <button class="g-btn" onclick="openGrade(10)">📚 10-sinf</button>
        <button class="g-btn" onclick="openGrade(11)">📚 11-sinf</button>
    </div>
</div>

<div class="card" id="screen-topic" style="display:none;"></div>
<div class="card" id="screen-quiz" style="display:none;"></div>

<script>
if (window.Telegram && window.Telegram.WebApp) {
    window.Telegram.WebApp.expand();
}

var savollar = [
    {
        q: "1. Abu Rayhon Beruniy nechanchi yillarda yashab ijod qilgan?",
        opts: ["A) 870-950-yillarda", "B) 973-1048-yillarda", "C) 980-1037-yillarda", "D) 1441-1501-yillarda"],
        ans: 1
    },
    {
        q: "2. Abu Rayhon Beruniy 1030-yilda qaysi hodisani bashorat qilgan?",
        opts: [
            "A) Quyosh tutilishini",
            "B) Atlantika ortida quruqlik, ya'ni Amerika qit'asi borligini",
            "C) Yangi davlat tashkil topishini",
            "D) Buyuk ipak yo'li ochilishini"
        ],
        ans: 1
    },
    {
        q: "3. O'zbekiston davlat madhiyasi ijro etilganda qanday holatda turish kerak?",
        opts: [
            "A) O'tirgan holda tinglash",
            "B) Bosh kiyimni yechib, sukut saqlash",
            "C) Tik turgan holda o'ng qo'lni ko'ksiga qo'yib tinglash",
            "D) Erkin harakatlanish"
        ],
        ans: 2
    }
];

var idx = 0, ball = 0, kombo = 0, javobBerildi = false, ishlatildi50 = false, taymer = null, vaqt = 20;

function showOnly(id) {
    document.getElementById("screen-home").style.display = "none";
    document.getElementById("screen-topic").style.display = "none";
    document.getElementById("screen-quiz").style.display = "none";
    document.getElementById(id).style.display = "block";
}

function goHome() {
    clearInterval(taymer);
    showOnly("screen-home");
}

function openGrade(sinf) {
    var box = document.getElementById("screen-topic");
    if (sinf === 5) {
        box.innerHTML = '<h2>📘 5-sinf Tarix</h2>' +
            '<div class="sub">Mavzuni tanlang:</div>' +
            '<button class="t-btn" onclick="startTest()">1-mavzu: Tarix darsiga ilk qadam. Mustaqillik. Vatan. Bilim</button>' +
            '<button class="back" onclick="goHome()">⬅️ Orqaga</button>';
    } else {
        box.innerHTML = '<h2>📚 ' + sinf + '-sinf Tarix</h2>' +
            '<div class="sub" style="color:#fbbf24; margin:20px 0;">Tez kunda savollar qo\'shiladi!</div>' +
            '<button class="back" onclick="goHome()">⬅️ Orqaga</button>';
    }
    showOnly("screen-topic");
}

function startTest() {
    idx = 0; ball = 0; kombo = 0; ishlatildi50 = false;
    loadQ();
}

function loadQ() {
    clearInterval(taymer);
    javobBerildi = false;
    vaqt = 20;
    var s = savollar[idx];
    var h = '<div class="bar"><span>Savol: ' + (idx + 1) + '/' + savollar.length + '</span><span>🪙 ' + ball + ' ball</span></div>' +
            '<div class="t-bg"><div class="t-fill" id="tfill"></div></div>' +
            '<button class="help" id="b50" onclick="do50()" ' + (ishlatildi50 ? 'disabled' : '') + '>💡 50/50</button>' +
            '<div class="q-text">' + s.q + '</div>';
    for (var i = 0; i < s.opts.length; i++) {
        h += '<button class="opt" id="o' + i + '" onclick="check(' + i + ')">' + s.opts[i] + '</button>';
    }
    var qbox = document.getElementById("screen-quiz");
    qbox.innerHTML = h;
    showOnly("screen-quiz");

    taymer = setInterval(function() {
        vaqt -= 0.2;
        var f = document.getElementById("tfill");
        if (f) {
            f.style.width = Math.max(0, (vaqt / 20) * 100) + "%";
            if (vaqt <= 7) f.style.background = "#ef4444";
        }
        if (vaqt <= 0) {
            clearInterval(taymer);
            if (!javobBerildi) {
                javobBerildi = true;
                kombo = 0;
                document.getElementById("o" + s.ans).classList.add("ok");
                setTimeout(nextQ, 1200);
            }
        }
    }, 200);
}

function do50() {
    if (ishlatildi50 || javobBerildi) return;
    ishlatildi50 = true;
    document.getElementById("b50").disabled = true;
    var togri = savollar[idx].ans;
    var xatolar = [];
    for (var i = 0; i < 4; i++) { if (i !== togri) xatolar.push(i); }
    document.getElementById("o" + xatolar[0]).classList.add("hide");
    document.getElementById("o" + xatolar[1]).classList.add("hide");
}

function check(tanlangan) {
    if (javobBerildi) return;
    javobBerildi = true;
    clearInterval(taymer);
    var togri = savollar[idx].ans;
    if (tanlangan === togri) {
        document.getElementById("o" + tanlangan).classList.add("ok");
        kombo++;
        ball += (kombo >= 2 ? 15 : 10);
    } else {
        document.getElementById("o" + tanlangan).classList.add("no");
        document.getElementById("o" + togri).classList.add("ok");
        kombo = 0;
    }
    setTimeout(nextQ, 1100);
}

function nextQ() {
    idx++;
    if (idx < savollar.length) {
        loadQ();
    } else {
        document.getElementById("screen-quiz").innerHTML =
            '<div style="text-align:center;">' +
            '<h2>🏆 Sinov yakunlandi!</h2>' +
            '<p style="color:#fbbf24; font-size:26px; font-weight:bold;">🪙 ' + ball + ' ball</p>' +
            '<button class="t-btn" style="text-align:center;" onclick="startTest()">🔄 Qayta ishlash</button>' +
            '<button class="back" onclick="goHome()">🏠 Sinflar menyusi</button>' +
            '</div>';
    }
}
</script>

</body>
</html>
