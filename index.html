<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarix Muallim — Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #ffffff;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 18px;
            padding: 20px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }
        h2 { color: #fbbf24; text-align: center; margin: 0 0 8px 0; font-size: 22px; }
        .subtitle { text-align: center; color: #94a3b8; font-size: 14px; margin-bottom: 18px; }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .grade-btn {
            background: linear-gradient(145deg, #334155, #1e293b);
            border: 1px solid rgba(251, 191, 36, 0.3);
            color: #f8fafc;
            padding: 16px 10px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: 0.2s;
        }
        .grade-btn:active { transform: scale(0.96); background: #475569; }
        .topic-btn {
            width: 100%;
            background: #2563eb;
            color: white;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            margin-bottom: 12px;
            line-height: 1.4;
        }
        .back-btn {
            width: 100%;
            background: transparent;
            border: 1px solid #475569;
            color: #cbd5e1;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 8px;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: #cbd5e1;
            margin-bottom: 10px;
        }
        .combo-badge {
            background: #f59e0b;
            color: #0f172a;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 12px;
        }
        .timer-bar-bg {
            width: 100%;
            height: 8px;
            background: #334155;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 16px;
        }
        .timer-bar-fill {
            height: 100%;
            width: 100%;
            background: #22c55e;
            transition: width 0.2s linear, background 0.3s;
        }
        .question { font-size: 17px; font-weight: 600; margin-bottom: 16px; line-height: 1.45; }
        .opt-btn {
            display: block;
            width: 100%;
            padding: 13px 14px;
            margin-bottom: 10px;
            background: #334155;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            text-align: left;
            cursor: pointer;
            transition: 0.2s;
        }
        .opt-btn:active { transform: scale(0.98); }
        .opt-btn.hidden { opacity: 0.25; pointer-events: none; }
        .correct { background: #16a34a !important; }
        .wrong { background: #dc2626 !important; }
        .lifelines {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 12px;
        }
        .help-btn {
            background: rgba(251, 191, 36, 0.15);
            border: 1px solid #fbbf24;
            color: #fbbf24;
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }
        .help-btn:disabled { opacity: 0.35; cursor: not-allowed; }
        .result { text-align: center; }
        .gold { color: #fbbf24; font-size: 28px; font-weight: bold; margin: 10px 0; }
    </style>
</head>
<body>

<div class="card" id="app"></div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const userName = tg.initDataUnsafe?.user?.first_name || "Oʻquvchi";

    // 5-sinf 1-mavzu savollari
    const questions5_1 = [
        {
            q: "1. Abu Rayhon Beruniy nechanchi yillarda yashab ijod qilgan?",
            options: ["A) 870–950-yillarda", "B) 973–1048-yillarda", "C) 980–1037-yillarda", "D) 1441–1501-yillarda"],
            answer: 1
        },
        {
            q: "2. Abu Rayhon Beruniy 1030-yilda qaysi hodisani bashorat qilgan?",
            options: [
                "A) Quyosh tutilishini",
                "B) Atlantika ortida quruqlik, ya’ni Amerika qit’asi borligini",
                "C) Yangi davlat tashkil topishini",
                "D) Buyuk ipak yo‘li ochilishini"
            ],
            answer: 1
        },
        {
            q: "3. O‘zbekiston davlat madhiyasi ijro etilganda qanday holatda turish kerak?",
            options: [
                "A) O‘tirgan holda tinglash",
                "B) Bosh kiyimni yechib, sukut saqlash",
                "C) Tik turgan holda o‘ng qo‘lni ko‘ksiga qo‘yib tinglash",
                "D) Erkin harakatlanish"
            ],
            answer: 2
        }
    ];

    let current = 0;
    let score = 0;
    let combo = 0;
    let answered = false;
    let used5050 = false;
    let timerInterval = null;
    let timeLeft = 20;

    function showHome() {
        clearInterval(timerInterval);
        let gradesHtml = "";
        for (let g = 5; g <= 11; g++) {
            gradesHtml += `<button class="grade-btn" onclick="selectGrade(${g})">📚 ${g}-sinf</button>`;
        }

        document.getElementById("app").innerHTML = `
            <h2>⚔️ Tarix Muallim</h2>
            <div class="subtitle">Xush kelibsiz, <b>${userName}</b>! Sinfni tanlang:</div>
            <div class="grid">${gradesHtml}</div>
        `;
    }

    function selectGrade(grade) {
        if (grade === 5) {
            document.getElementById("app").innerHTML = `
                <h2>📘 5-sinf Tarix</h2>
                <div class="subtitle">Mavzuni tanlang:</div>
                <button class="topic-btn" onclick="startQuiz()">
                    1-mavzu: Tarix darsiga ilk qadam. Mustaqillik. Vatan. Bilim (3 ta savol)
                </button>
                <button class="back-btn" onclick="showHome()">⬅️ Sinflar menyusiga qaytish</button>
            `;
        } else {
            document.getElementById("app").innerHTML = `
                <h2>📚 ${grade}-sinf Tarix</h2>
                <div class="subtitle" style="margin: 25px 0; color: #fbbf24;">
                    ⏳ ${grade}-sinf mavzulari va testlari tez kunda qoʻshiladi!
                </div>
                <button class="back-btn" onclick="showHome()">⬅️ Sinflar menyusiga qaytish</button>
            `;
        }
    }

    function startQuiz() {
        current = 0;
        score = 0;
        combo = 0;
        used5050 = false;
        loadQuestion();
    }

    function loadQuestion() {
        clearInterval(timerInterval);
        answered = false;
        timeLeft = 20;

        const item = questions5_1[current];
        const comboText = combo >= 2 ? `<span class="combo-badge">🔥 x${combo} Kombo</span>` : "";

        let optionsHtml = "";
        item.options.forEach((opt, idx) => {
            optionsHtml += `<button class="opt-btn" id="opt_${idx}" onclick="checkAnswer(${idx})">${opt}</button>`;
        });

        document.getElementById("app").innerHTML = `
            <div class="top-bar">
                <span>Savol: <b>${current + 1}/${questions5_1.length}</b></span>
                ${comboText}
                <span>🪙 <b>${score}</b></span>
            </div>
            <div class="timer-bar-bg">
                <div class="timer-bar-fill" id="timer-fill"></div>
            </div>
            <div class="lifelines">
                <button class="help-btn" id="btn5050" onclick="use5050()" ${used5050 ? "disabled" : ""}>
                    💡 50 / 50
                </button>
            </div>
            <div class="question">${item.q}</div>
            <div>${optionsHtml}</div>
        `;

        startTimer();
    }

    function startTimer() {
        const fill = document.getElementById("timer-fill");
        timerInterval = setInterval(() => {
            timeLeft -= 0.2;
            const pct = Math.max(0, (timeLeft / 20) * 100);
            fill.style.width = pct + "%";

            if (timeLeft <= 7) fill.style.background = "#ef4444";
            else if (timeLeft <= 13) fill.style.background = "#f59e0b";

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                timeOut();
            }
        }, 200);
    }

    function timeOut() {
        if (answered) return;
        answered = true;
        combo = 0;
        const correctIdx = questions5_1[current].answer;
        document.getElementById(`opt_${correctIdx}`).classList.add("correct");
        setTimeout(nextStep, 1200);
    }

    function use5050() {
        if (used5050 || answered) return;
        used5050 = true;
        document.getElementById("btn5050").disabled = true;

        const correctIdx = questions5_1[current].answer;
        let wrongIndices = [0, 1, 2, 3].filter(i => i !== correctIdx);
        wrongIndices.sort(() => Math.random() - 0.5);

        document.getElementById(`opt_${wrongIndices[0]}`).classList.add("hidden");
        document.getElementById(`opt_${wrongIndices[1]}`).classList.add("hidden");
    }

    function checkAnswer(selected) {
        if (answered) return;
        answered = true;
        clearInterval(timerInterval);

        const correctIdx = questions5_1[current].answer;
        const selectedBtn = document.getElementById(`opt_${selected}`);

        if (selected === correctIdx) {
            selectedBtn.classList.add("correct");
            combo++;
            const bonus = combo >= 2 ? 15 : 10;
            score += bonus;
        } else {
            selectedBtn.classList.add("wrong");
            document.getElementById(`opt_${correctIdx}`).classList.add("correct");
            combo = 0;
        }

        setTimeout(nextStep, 1100);
    }

    function nextStep() {
        current++;
        if (current < questions5_1.length) {
            loadQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        clearInterval(timerInterval);
        document.getElementById("app").innerHTML = `
            <div class="result">
                <h2>🏆 Mavzu yakunlandi!</h2>
                <p>Barakalla, <b>${userName}</b>!</p>
                <p style="color:#94a3b8; font-size:14px;">5-sinf • 1-mavzu</p>
                <div class="gold">🪙 ${score} ball</div>
                <button class="opt-btn" style="text-align:center; background:#2563eb; margin-top:15px;" onclick="startQuiz()">🔄 Qayta ishlash</button>
                <button class="back-btn" onclick="showHome()">🏠 Bosh menyuga qaytish</button>
            </div>
        `;
    }

    showHome();
</script>

</body>
</html>
