<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PedLine</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #eef3fb;
    --surface: #f6f8fd;
    --text: #1b2433;
    --muted: #6b7a90;
    --primary: #1f7ae8;
    --primary-soft: #dfeafd;
    --border: #e1e8f3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1622;
      --surface: #172033;
      --text: #e8eefb;
      --muted: #8a99b3;
      --primary: #5aa0ff;
      --primary-soft: #1f3256;
      --border: #25314a;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  /* Sahifalar */
  .page {
    display: none;
    padding: 20px 20px calc(96px + env(safe-area-inset-bottom, 0px));
    min-height: 100%;
  }
  .page.active { display: block; }
  .page h1 { margin: 0 0 8px; font-size: 24px; }
  .page p { margin: 0; color: var(--muted); }

  /* Pastki menyu */
  .tabbar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    display: flex;
    justify-content: space-around;
    padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px));
    background: var(--surface);
    border-top: 1px solid var(--border);
    z-index: 100;
  }
  .tab {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 0;
    border: 0;
    background: none;
    color: var(--muted);
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  .tab .icon {
    width: 52px; height: 36px;
    display: grid; place-items: center;
    border-radius: 14px;
    transition: background .2s, color .2s;
  }
  .tab svg {
    width: 24px; height: 24px;
    fill: none; stroke: currentColor;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
  }
  .tab.active { color: var(--primary); font-weight: 600; }
  .tab.active .icon { background: var(--primary-soft); }
  .tab:focus-visible .icon { outline: 2px solid var(--primary); }
</style>
</head>
<body>

<!-- SAHIFALAR: o'z kontentingizni shu yerga joylang -->
<main>
  <section class="page active" id="home">
    <h1>Bosh sahifa</h1>
    <p>Asosiy sahifa kontenti shu yerda.</p>
  </section>
  <section class="page" id="courses">
    <h1>Kurslar</h1>
    <p>Kurslar ro'yxati shu yerda.</p>
  </section>
  <section class="page" id="rating">
    <h1>Reyting</h1>
    <p>Foydalanuvchilar reytingi shu yerda.</p>
  </section>
  <section class="page" id="profile">
    <h1>Profil</h1>
    <p>Profil ma'lumotlari shu yerda.</p>
  </section>
</main>

<!-- PASTKI MENYU -->
<nav class="tabbar" aria-label="Asosiy menyu">
  <button class="tab active" data-page="home">
    <span class="icon">
      <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>
    </span>
    Bosh sahifa
  </button>
  <button class="tab" data-page="courses">
    <span class="icon">
      <svg viewBox="0 0 24 24"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11.5V16c0 1.5 3 3 6 3s6-1.500 6-3v-4.500"/><path d="M22 9v6"/></svg>
    </span>
    Kurslar
  </button>
  <button class="tab" data-page="rating">
    <span class="icon">
      <svg viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H4v1a4 4 0 0 0 4 4"/><path d="M16 6h4v1a4 4 0 0 1-4 4"/><path d="M12 13v4"/><path d="M8 20h8"/><path d="M10 17h4"/></svg>
    </span>
    Reyting
  </button>
  <button class="tab" data-page="profile">
    <span class="icon">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.500-7 8-7s8 3 8 7"/></svg>
    </span>
    Profil
  </button>
</nav>

<script>
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  const tabs = document.querySelectorAll('.tab');
  const pages = document.querySelectorAll('.page');

  function showPage(id) {
    pages.forEach(p => p.classList.toggle('active', p.id === id));
    tabs.forEach(t => t.classList.toggle('active', t.dataset.page === id));
    window.scrollTo(0, 0);
    try { sessionStorage.setItem('tab', id); } catch (e) {}
  }

  tabs.forEach(t => t.addEventListener('click', () => {
    showPage(t.dataset.page);
    if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
  }));

  // Oxirgi ochilgan tabni eslab qolish
  try {
    const last = sessionStorage.getItem('tab');
    if (last && document.getElementById(last)) showPage(last);
  } catch (e) {}
</script>
</body>
</html>
