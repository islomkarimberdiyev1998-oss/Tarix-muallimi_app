<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tarix muallim</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0d1b36;--panel:#16294d;--line:#2a4172;--ink:#f1ede2;--mute:#9fb0cf;--tq:#34b8a6;--gold:#e6b445;--bad:#e5675b;--okbg:#12403f;--nobg:#4a2530;--onacc:#06231f;--ongold:#2a1d00;color-scheme:dark}
:root[data-theme=light]{--bg:#f4f1ea;--panel:#ffffff;--line:#d8d2c2;--ink:#14213d;--mute:#5b6985;--tq:#0e8576;--gold:#a8741a;--bad:#c0392b;--okbg:#d7f0ea;--nobg:#f9dcd8;--onacc:#ffffff;--ongold:#ffffff;color-scheme:light}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;padding:16px 16px calc(28px + env(safe-area-inset-bottom,0px))}
#app{max-width:520px;margin:0 auto}
h1,h2,.num{font-family:Georgia,"Times New Roman",serif;font-weight:700}
h1{font-size:26px;line-height:1.1}
h2{font-size:22px;margin:6px 0 14px}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.brand{display:flex;align-items:center;gap:12px;margin:4px 0 20px}
.mute{color:var(--mute)}.gold{color:var(--gold);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 8px 12px;text-align:center}
.tile .num{font-size:38px;line-height:1;color:var(--gold);display:block}
.tile small{color:var(--mute);font-size:13px}
.tile.wide{grid-column:span 3;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;text-align:left}
.tile.wide b{font-family:Georgia,serif;font-size:18px}
.tile.soon{opacity:.5}
.back{background:none;color:var(--mute);padding:6px 0;margin-bottom:4px}
.list{display:grid;gap:10px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;width:100%}
.item.soon{opacity:.5}
.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.tm{font-family:Georgia,serif;font-size:22px;font-weight:700;color:var(--tq);min-width:32px;text-align:right}
.bar{height:6px;background:var(--panel);border-radius:3px;overflow:hidden;margin-bottom:20px}
.bar i{display:block;height:100%;width:100%;background:var(--tq)}
.q{font-family:Georgia,serif;font-size:21px;line-height:1.3;margin-bottom:18px}
.opt{display:block;width:100%;text-align:left;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.opt.ok{border-color:var(--tq);background:var(--okbg)}
.opt.no{border-color:var(--bad);background:var(--nobg)}
.opt.off{opacity:.25}
.opt:disabled{cursor:default}
.note{margin:6px 0 14px;padding:12px 14px;border-left:3px solid var(--gold);background:var(--panel);border-radius:0 10px 10px 0}
.btn{display:block;width:100%;background:var(--tq);color:var(--onacc);font-weight:700;border-radius:12px;padding:14px;margin-top:10px}
.btn.alt{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.hint{background:none;border:1.5px dashed var(--gold);color:var(--gold);border-radius:20px;padding:6px 14px;font-size:14px}
.hint:disabled{opacity:.35}
.score{text-align:center;margin:10px 0 18px}
.score .num{font-size:64px;color:var(--gold);line-height:1}
.miss{background:var(--panel);border-radius:12px;padding:12px 14px;margin-bottom:8px;font-size:15px}
.miss b{color:var(--tq)}
.me{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:18px}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--line);display:grid;place-items:center;font:700 22px Georgia,serif;color:var(--gold);overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.name{font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{background:var(--gold);color:var(--ongold);font-size:12px;font-weight:700;border-radius:10px;padding:2px 8px}
.quote{margin:0 0 18px;padding:12px 14px;border-left:3px solid var(--gold);background:var(--panel);border-radius:0 12px 12px 0}
.quote .qt{font-family:Georgia,serif;font-size:16px;line-height:1.4;margin-bottom:4px}
.theme{margin-left:auto;width:40px;height:40px;border-radius:50%;background:var(--panel);border:1px solid var(--line);font-size:18px;line-height:1}
.ref{margin:0 0 14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.ref b{font-family:Georgia,serif;font-size:18px}
.rrow{display:flex;gap:10px}
.rrow .btn{flex:1;width:auto;padding:10px;margin-top:8px}
.brand small{display:block;color:var(--mute);font-size:13px;margin-top:2px}
.inf{flex:1;min-width:0}
.lvl{height:5px;background:var(--line);border-radius:3px;margin-top:7px;overflow:hidden}
.lvl i{display:block;height:100%;background:var(--gold);border-radius:3px}
.sub{color:var(--mute);margin:-8px 0 14px}
.secs{display:grid;gap:12px}
.sec{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;position:relative;overflow:hidden}
.sec::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.sec .ic{flex:none;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:26px;background:color-mix(in srgb,var(--c) 20%,transparent)}
.sec .tx{flex:1;min-width:0}
.sec .tx b{display:block;font-family:Georgia,"Times New Roman",serif;font-size:17px;line-height:1.25}
.sec .tx small{color:var(--mute);font-size:13px}
.sec .pill{flex:none;font-size:12px;font-weight:700;color:color-mix(in srgb,var(--c) 65%,var(--ink));border:1px solid color-mix(in srgb,var(--c) 65%,var(--ink));border-radius:20px;padding:3px 10px;white-space:nowrap}
.sec.soon{opacity:.62}
.sec.soon .pill{color:var(--mute);border-color:var(--line)}
.books{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.book{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-align:center;padding:0;width:100%}
.book img{display:block;width:100%;aspect-ratio:2/3;object-fit:cover;object-position:center top;background:var(--line)}
.book .bt{padding:10px 8px 12px}
.book b{display:block;font-family:Georgia,"Times New Roman",serif;font-size:15px;line-height:1.25;margin-bottom:4px}
.book small{color:var(--mute);font-size:12px}
.bh{display:flex;gap:12px;align-items:center;margin:0 0 16px}
.bh img{width:58px;aspect-ratio:2/3;object-fit:cover;object-position:center top;border-radius:8px;border:1px solid var(--line);flex:none}
.bh b{display:block;font-family:Georgia,"Times New Roman",serif;font-size:18px;line-height:1.25}
.bks{display:grid;gap:12px}
.bk{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px}
.bk .th{flex:none;width:68px;aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:var(--line);display:grid;place-items:center;font:700 28px Georgia,serif;color:var(--gold)}
.bk .th img{display:block;width:100%;height:100%;object-fit:cover;object-position:center top}
.bk .tx{flex:1;min-width:0}
.bk .tx b{display:block;font-family:Georgia,"Times New Roman",serif;font-size:17px;line-height:1.25;margin-bottom:2px}
.bk .tx small{color:var(--mute);font-size:13px}
.pill2{flex:none;font-size:12px;font-weight:700;color:var(--gold);border:1px solid var(--gold);border-radius:20px;padding:3px 10px;white-space:nowrap}
.pill2.z{color:var(--mute);border-color:var(--line)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--gold);color:var(--ongold);padding:10px 18px;border-radius:20px;font-weight:600}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const tg=window.Telegram&&Telegram.WebApp;
if(tg){tg.ready();tg.expand()}
// DIQQAT: o'z botingiz havolasini shu yerga yozing (referal havola uchun)
const BOT_LINK='https://t.me/Tarixustoz_bot';
const app=document.getElementById('app');
let DATA=null,S={},timer=null,backFn=null;
const L=(k,v)=>{try{return v===undefined?localStorage.getItem(k):localStorage.setItem(k,v)}catch(e){return null}};
const BG={dark:'#0d1b36',light:'#f4f1ea'};
function applyTheme(t,save){
  document.documentElement.dataset.theme=t;
  if(save)L('theme_tm',t);
  if(tg){try{tg.setHeaderColor(BG[t]);tg.setBackgroundColor(BG[t])}catch(e){}}
}
const savedTheme=L('theme_tm');
applyTheme(BG[savedTheme]?savedTheme:(tg&&tg.colorScheme==='light'?'light':'dark'),false);
(function(){const sp=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.start_param;if(sp&&sp.indexOf('ref_')===0&&!L('ref_tm'))L('ref_tm',sp.slice(4))})();
const meUser=()=>tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user;
const refLink=()=>BOT_LINK+'?startapp=ref_'+(meUser()?meUser().id:'0');
const noBot=()=>BOT_LINK.indexOf('BOT_USERNAME')>=0;
function shareRef(){
  if(noBot()){toast('Bot havolasi kiritilmagan');return}
  const l='https://t.me/share/url?url='+encodeURIComponent(refLink())+'&text='+encodeURIComponent('Tarix muallim — tarixdan testlar. Men bilan birga o‘rgan!');
  if(tg&&tg.openTelegramLink)tg.openTelegramLink(l);else window.open(l,'_blank');
}
function copyRef(){
  if(noBot()){toast('Bot havolasi kiritilmagan');return}
  try{navigator.clipboard.writeText(refLink()).then(()=>toast('Havola nusxalandi'),()=>toast('Nusxalab bo‘lmadi'))}catch(e){toast('Nusxalab bo‘lmadi')}
}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function h(tag,cls,txt,on){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;if(on)e.onclick=on;return e}
function setBack(fn){
  if(tg&&tg.BackButton){if(backFn)tg.BackButton.offClick(backFn);backFn=fn;if(fn){tg.BackButton.onClick(fn);tg.BackButton.show()}else tg.BackButton.hide()}
}
function screen(back){
  clearInterval(timer);app.innerHTML='';setBack(back);
  if(back)app.append(h('button','back','‹ Orqaga',back));
}
function toast(t){const e=h('div','toast',t);document.body.append(e);setTimeout(()=>e.remove(),1800)}
const SECS=[
{k:'eski',ic:'📚',c:'#e6b445',t:'Eski darslik asosida testlar',s:'2017–2019 yillar',g:1},
{k:'yangi',ic:'📖',c:'#34b8a6',t:'Yangilangan darslik asosida testlar',s:'2022–2025 yillar',g:1},

{k:'pedagogika',ic:'🧭',c:'#7bd389',t:'Pedagogika + Kasb standarti',s:'Pedagogik mahorat'}];

const BT={jahon:'Jahon tarixi',uz:'O‘zbekiston tarixi'};
const cov=(g,b)=>COV[g+':'+(b||'main')];

const btitle=(k,g,b)=>b?(BT[b]||b):((k==='yangi'&&TT[g])||`${g}-sinf`);

function info(d){
  if(d.g){let n=0,q=0,bk=false;
    for(let g=5;g<=11;g++){const G=String(g),B=gbooks(d.k,G);
      if(B)bk=true;
      (B?Object.keys(B).map(b=>gt(d.k,G,b)):[gt(d.k,G)]).forEach(a=>{n+=a.length;q+=qcount(a)})}
    return{has:n>0||bk,q}}
  const a=sd(d.k).topics||[];return{has:a.length>0,q:qcount(a)};
}

function myPoints(){let s=0;try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.indexOf('tm_')===0)s+=+localStorage.getItem(k)||0}}catch(e){}return s}
function home(){
  screen(null);
  const u=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user;
  const name=u?[u.first_name,u.last_name].filter(Boolean).join(' ')||'Mehmon':'Mehmon';
  const pts=myPoints();
  const b=h('div','brand');b.innerHTML=LOGO;
  const t=h('div');t.append(h('h1',null,'Tarix muallim'),h('small',null,'Tarix fanidan testlar va tayyorgarlik'));b.append(t);
  const light=document.documentElement.dataset.theme==='light';

  tb.setAttribute('aria-label','Kunduzgi va tungi rejim');b.append(tb);

  const info2=h('div','inf'),nm=h('div','name');

  info2.append(nm,h('div','mute',`Reyting: ${pts} ball · ${Math.floor(pts/100)+1}-daraja`),lv);
  me.append(av,info2);
  const rf=h('div','ref');
  rf.append(h('b',null,'Do‘stlarni taklif qiling'),h('div','mute','Havolangiz orqali do‘stlaringiz ham tarixni o‘rgansin.'));
  const rb=h('div','rrow');rb.append(h('button','btn','Ulashish',shareRef),h('button','btn alt','Nusxalash',copyRef));
  rf.append(rb);

function gradesScreen(k){
  const d=SECS.find(x=>x.k===k);
  screen(home);
  app.append(h('h2',null,d.t),h('div','sub',d.s));
  const l=h('div','bks');
  for(let n=5;n<=11;n++){
    const G=String(n),B=gbooks(k,G);
    (B?Object.keys(B):[undefined]).forEach(b=>{
      const q=qcount(gt(k,G,b));
      const x=h('button','bk',null,()=>topicsScreen(k,G,b));
      const c=k==='yangi'?cov(G,b):null,th=h('div','th');
      if(c){const im=document.createElement('img');im.alt='';im.src=c;th.append(im)}else th.textContent=G;
      const tx=h('div','tx');tx.append(h('b',null,btitle(k,G,b)),h('small',null,`${G}-sinf`));
      x.append(th,tx,h('span','pill2'+(q?'':' z'),q?`${q} ta test`:'tez kunda'));
      l.append(x);
    });
  }
  app.append(l);
}
function topicsScreen(k,g,b){
  const d=SECS.find(x=>x.k===k);
  screen(g?()=>gradesScreen(k):home);
  const list=g?gt(k,g,b):(sd(k).topics||[]);
  const c=g&&k==='yangi'?cov(g,b):null;
  if(c){
    const hd=h('div','bh'),im=document.createElement('img');im.alt='';im.src=c;
    const tx=h('div');tx.append(h('b',null,btitle(k,g,b)),h('div','mute',`${g}-sinf · ${d.t}`));
    hd.append(im,tx);app.append(hd);
  }else app.append(h('h2',null,g?`${g}-sinf mavzulari`:d.t),h('div','sub',g?d.t:d.s));
  const l=h('div','list');
  list.forEach(t=>{
    const n=t.questions.length,bs=+L('tm_'+t.id)||0;
    const i=h('button','item'+(n?'':' soon'),null,()=>n?start(k,g,b,t):toast('Savollar tez orada'));
    i.append(h('span',null,t.title),h('span',n?'gold':'mute',n?`${n} ta test`+(bs?` · ${bs} ball`:''):'tez kunda'));l.append(i);
  });
  app.append(l);
  if(!list.length)app.append(h('div','mute','Mavzular tez orada qo‘shiladi.'));
}
function start(k,g,b,t){
  const qs=shuffle(t.questions).slice(0,20).map(q=>({q:q.q,e:q.e,o:shuffle(q.a.map((x,i)=>({x,ok:i===q.c})))}));
  S={k,g,b,t,qs,i:0,pts:0,combo:0,ok:0,hint:true,miss:[]};
  ask();
}
function ask(){
  const q=S.qs[S.i];S.locked=false;
  screen(()=>{if(confirm('Testdan chiqasizmi?'))topicsScreen(S.k,S.g,S.b)});
  const top=h('div','row');
  S.ptsEl=h('span','gold',`${S.pts} ball`);S.timeEl=h('span','tm','20');
  top.append(h('span','mute',`${S.i+1} / ${S.qs.length}`),S.ptsEl,S.timeEl);
  const bar=h('div','bar');S.bar=h('i');bar.append(S.bar);
  app.append(top,bar,h('div','q',q.q));
  S.btns=q.o.map((o,k)=>{const b=h('button','opt',o.x,()=>pick(k));app.append(b);return b});
  S.box=h('div');
  const hint=h('button','hint','50/50',()=>{
    if(!S.hint||S.locked)return;S.hint=false;hint.disabled=true;
    shuffle(q.o.map((o,k)=>k).filter(k=>!q.o[k].ok)).slice(0,2).forEach(k=>{S.btns[k].disabled=true;S.btns[k].classList.add('off')});
  });
  hint.disabled=!S.hint;S.box.append(hint);app.append(S.box);
  S.left=20;
  timer=setInterval(()=>{
    S.left-=.25;S.bar.style.width=Math.max(S.left,0)/20*100+'%';S.timeEl.textContent=Math.max(Math.ceil(S.left),0);
    if(S.left<=0)pick(-1);
  },250);
}
function pick(i){
  if(S.locked)return;S.locked=true;clearInterval(timer);
  const q=S.qs[S.i],right=i>=0&&q.o[i].ok;
  if(right){S.combo++;S.ok++;S.pts+=10+2*Math.min(S.combo-1,4)}else{S.combo=0;S.miss.push(q)}
  S.btns.forEach((b,k)=>{b.disabled=true;if(q.o[k].ok)b.classList.add('ok');else if(k===i)b.classList.add('no')});
  S.ptsEl.textContent=`${S.pts} ball`;
  const msg=right?(S.combo>1?`To'g'ri! ${S.combo} ta ketma-ket.`:"To'g'ri!"):(i<0?'Vaqt tugadi.':"Noto'g'ri.");
  S.box.innerHTML='';
  const n=h('div','note');n.append(h('b',null,msg));
  if(q.e){n.append(h('div','mute',q.e))}
  const last=S.i+1>=S.qs.length;
  S.box.append(n,h('button','btn',last?"Natijani ko'rish":'Keyingi savol',()=>{S.i++;last?result():ask()}));
}
function result(){
  const n=S.qs.length,p=S.ok/n,id=S.t.id,prev=+L('tm_'+id)||0;
  if(S.pts>prev)L('tm_'+id,S.pts);
  screen(()=>topicsScreen(S.k,S.g,S.b));
  const sc=h('div','score');
  sc.append(h('div','num',`${S.ok}/${n}`),h('div','gold',`${S.pts} ball`),
    h('div','mute',S.pts>prev&&prev?"Yangi rekord!":`Eng yaxshi natija: ${Math.max(prev,S.pts)} ball`),
    h('div',null,p>=.8?'Ajoyib natija!':p>=.5?"Yaxshi, yana urinib ko'ring.":"Mavzuni qayta o'qib chiqing."));
  app.append(sc);
  if(S.miss.length){
    app.append(h('h2',null,'Xatolar tahlili'));
    S.miss.forEach(q=>{const m=h('div','miss');m.append(h('div',null,q.q));const c=h('div','mute');c.append("To'g'ri javob: ",h('b',null,q.o.find(o=>o.ok).x));m.append(c);app.append(m)});
  }
  app.append(h('button','btn','Qayta urinish',()=>start(S.k,S.g,S.b,S.t)),h('button','btn alt','Mavzular',()=>topicsScreen(S.k,S.g,S.b)));
}
fetch('questions.json?v='+Date.now()).then(r=>r.json()).then(d=>{DATA=norm(d);home()})
  .catch(()=>{app.append(h('p',null,"Savollarni yuklab bo'lmadi. questions.json fayli index.html bilan bir joyda ekanini tekshiring."))});
</script>
